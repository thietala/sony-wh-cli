name: CI (Linux, Windows, macOS)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y libbluetooth-dev libdbus-1-dev
          - os: windows-latest
            install_deps: ""
          - os: macos-latest
            install_deps: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        if: matrix.install_deps != ''
        shell: bash
        run: |
          ${{ matrix.install_deps }}

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_TESTING=ON

      - name: Build all targets
        shell: bash
        run: |
          cmake --build build --config ${BUILD_TYPE} --parallel

      - name: Run unit & protocol tests
        shell: bash
        run: |
          ctest --test-dir build -C ${BUILD_TYPE} --output-on-failure --no-tests=error
