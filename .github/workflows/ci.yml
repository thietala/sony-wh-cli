name: CI (Linux, Windows, macOS)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      # third_party/ is vendored (nlohmann/json) and kept as-is.
      - name: Check formatting
        run: |
          git ls-files -- '*.cpp' '*.h' '*.hpp' '*.cc' '*.cxx' \
            | grep -v '^third_party/' \
            | xargs clang-format-18 --dry-run --Werror -style=file

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y libbluetooth-dev libdbus-1-dev
          - os: windows-latest
            install_deps: ""
          - os: macos-latest
            install_deps: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install dependencies
        if: matrix.install_deps != ''
        shell: bash
        run: |
          ${{ matrix.install_deps }}

      # The default Visual Studio generator (MSBuild) stops each vcxproj at
      # its first failing file, so a broken push only ever shows one error
      # per project per run. Ninja's -k (below) needs a generator that
      # actually supports it, so switch Windows to Ninja + a real MSVC
      # environment (cl.exe isn't on PATH otherwise).
      - name: Ensure Ninja is available (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_TESTING=ON
          else
            cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_TESTING=ON
          fi

      # -k (Make/Ninja's own "keep going", passed through the -- separator -
      # CMake itself has no build-tool-agnostic flag for this): report
      # every file's errors in this run instead of stopping at the first
      # one, so one push surfaces everything to fix instead of a slow
      # one-at-a-time trickle across several pushes.
      - name: Build all targets
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build --config ${BUILD_TYPE} --parallel -- -k 0
          else
            cmake --build build --config ${BUILD_TYPE} --parallel -- -k
          fi

      - name: Run unit & protocol tests
        shell: bash
        run: |
          ctest --test-dir build -C ${BUILD_TYPE} --output-on-failure --no-tests=error
